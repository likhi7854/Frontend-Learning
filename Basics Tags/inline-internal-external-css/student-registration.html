<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <h1>Student Registration</h1>
    <form action="submit_registration.php" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="DOB">Date of Birth:</label>
        <input type="date" id="DOB" name="DOB" required><br><br>

        <label for="course">Course:</label>
        <select id="course" name="course" required>
            <option value="">Select a course</option>
            <option value="java">Java Full Stack</option>
            <option value="python">Python Development</option>
            <option value="web">Web Development</option>
        </select><br><br>

        <label for="skills" >Skills:</label><br><br>
        <input type="checkbox" id="html" name="skills" value="HTML">HTML<br><br>
        <input type="checkbox" id="css" name="skills" value="CSS">CSS<br><br>
        <input type="checkbox" id="js" name="skills" value="JavaScript">JavaScript<br><br>
        <input type="checkbox" id="java" name="skills" value="Java">Java<br><br>
        <input type="checkbox" id="python" name="skills" value="Python">Python<br><br>
        
        <label for ="about">About Yourself:</label><br><br>
        <textarea id="about" name="about" rows="4" cols="50" placeholder="Tell us about yourself..."></textarea><br><br>
        <input type="submit" value="Register">
</body>
</html>
