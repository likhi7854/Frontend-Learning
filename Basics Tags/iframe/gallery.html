<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Photo Gallery</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .box {
            display: inline-block;
            width: 120px;
            height: 100px;
            margin: 10px;
            line-height: 100px;
            background-color: #ff9900;
            color: black;
            font-weight: bold;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h2>Tour Highlights</h2>
    <div class="box"><img src="photo1.jpg" alt="Photo 1" width="100" height="80"></div>
    <div class="box"><img src="photo2.jpg" alt="Photo 2" width="100" height="80"></div>
    <div class="box"><img src="photo3.jpg" alt="Photo 3" width="100" height="80"></div>
</body>
</html>
