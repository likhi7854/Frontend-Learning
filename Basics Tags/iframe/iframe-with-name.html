<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Named Iframe</title>
</head>
<body>
    <h1>Named Iframe</h1>
    <p>Here is an iframe with a name attribute:</p>
    <iframe src="my-dream-list.html" width="600" height="400" title="My Dream List" name="dreamList"></iframe>
    
</body>
</html>
