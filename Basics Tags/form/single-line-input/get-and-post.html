<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
    <h1>Couse search</h1>
    <p>Enter the name of the course you want to search for:</p>
    <form method = "get">
        <label for="course">Enter the course name:</label>
        <input type="text" id="course" name="course" placeholder="Enter course name">
    
    </form>
    <h1>Student Registration: </h1>
    <p>Please fill in the details below to register.</p>
    <form method = "post">
        <label for="name">Student Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name">
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email">
        <br><br>
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">
    </form>
    <p>Thank you for registering!</p>
</body>
</html>
