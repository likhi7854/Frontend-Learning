<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information </title>
</head>
<body>
      <H1>Student Information </H1>
      <table border = "3"  rules = "all">
          <thead>
               <tr>
                   <th>Field</th>
                   <th>Input</th>
               </tr>
          </thead>
          <tbody>
               <tr>
                  <td><label for="name"> Name </label></td>
                  <td><input type="text" name="name" id="name" placeholder="Enter your name"></td>
               </tr>
               <tr>
                    <td><label for="email">Email </label></td>
                    <td><input type = "email" name = "email" id="email" placeholder="Enter your email"></td>
               </tr>
               <tr>
                   <td><label for="age">Age  </label> </td>
                   <td><input type ="number" name = "age" id="age" placeholder = "Enter your age "></td>
               </tr>
               <tr>
                    <td> <label> Phone </label></td>
                    <td><input type = "tel"  name = "phone" placeholder = "Enter your phone number" pattern = [6-9]{1}[0-9]{9}> </td>
               </tr>
          </tbody>
      </table>
</body>
</html>
