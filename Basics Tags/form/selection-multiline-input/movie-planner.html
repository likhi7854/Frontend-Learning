<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Night Planner</title>
</head>
<body>
    <h1>Movie Night Planner</h1>
    <form>
        <label for = "movie" >Enter the movie Name : </label>
        <input type="search" id = "movie" name = "movie" placeholder="movie name ">
        <br><br>
        <label for = "date" > Date : </label>
        <input type="date" id = "date" name = "d">
        <br><br>
        <label for = "time" > time  :</label>
        <input type="time" id = "time" name = "t">
        <br><br>
        <label for = "lang" >Select the language :</label>
        <br><br>
        <select id = "lang" name = "Langauge">
            <option>--select--</option>
            <option>Telugu </option>
            <option>Hindi </option>
            <option>Tamil</option>
            <option> Malyalam</option>
        </select>
        <br><br>
        <label for = "Seating"> Seating preference </label><br><br>
        <input type="radio" id = "Sea" name = "sp">Regular Seating <br><br>
        <input type="radio" id = "Seating" name = "sp">Premium Seating <br><br>
        <label for = "snacks"> Select the Snacks :</label><br><br>
        <input type="checkbox" id = "pc" name = "sk" value="pc" >Popcorn<br><br>
        <input type="checkbox" id = "j" name = "sk" value="jc" >Juice<br><br>
        <input type="checkbox" id = "s" name = "sk" value="sw" >Sandwich<br><br>
        <input type="submit" value="submit">





    </form>
</body>
</html>
