<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
</head>
<body>
    <h1>Personal Portfolio Information</h1>
    <form>
        <label for = "name" > Name :</label>
        <input type="text" id ="name" required name="n" >
        <br><br>
        <label for = "web" > Portfolio websit:</label>
        <input type="url" id ="web" required name="w" >
        <br><br>
        <label for = "col" > Favorite color:</label>
        <input type="color" id ="col" required name="fc" >
        <br><br>
        <label for = "Resume " >Resume :</label>
        <input type="file" id ="Resume " required name="r" >
        <br><br>
        <label for = "Graduation" > Graduation date :</label>
        <input type="date" id ="Graduation" required name="g" >
        <br><br>
        <label for = "week" > Available week :</label>
        <input type="week" id ="week" required name="w" >
        <br><br>
        <label for = "time" > Contact time:</label>
        <input type="time" id ="time" required name="c" >
        <br><br>
        <input type="submit" value="Submit">
    </form>
    
</body>
</html>
