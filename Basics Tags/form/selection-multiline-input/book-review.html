<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Review Form </title>
</head>
<body>
     <h1> Book Review Form </h1>
     <form>
     <label for = "name">Enter the Book Name:</label>
     <input type="search"   id = "name"  placeholder="Book Name"  name = "book" >
     <br><br>
     <label for = "rating" > Enter the Rating of the book : </label>
     <input type="number" id = "rating" placeholder="rating" name ="rating"min =1>
     <br><br>
     <label for = "about">Review of the book :</label>
     <br><br>
     <textarea id = "about" name = "review" rows ="5" cols ="30 "></textarea>
     <br><br>
     <label for = "date"> Reading date :</label>
     <input type="date" name="d" id = "date">
     <br><br>
     <input type="submit" value="submit">
</form>

</body>
</html>
