<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
</head>
<body>
     <h1>Feedback Form</h1>
     <form>
        <label for = "name" > Name :</label>
        <input type="text" id ="name" required name="n" >
        <br><br>
        <label for = "email" >Email :</label>
        <input type="email" id = "email" required name = "e">
        <br><br>
        <label for = "date" > Event date :</label>
        <input type="date" id ="date" required name="g" >
        <br><br>
        <label for = "rec">Would you recommend us: </label><br><br>
        <input type = "radio" name = "rm" id="rec">Yes <br><br>
        <input type="radio" name="rm" id = "rec">No 
        <br><br>
        <label for = "rating">Rating of the movie :</label>
        <input type="number" name="nm" id = "rating" min="0" max ="10">
        <br><br>
        <label for = "su">Services used :</label>
        <input type="checkbox" id = "water" name = "w">WATER<br><br>
        <input type="checkbox" id = "FOOD" name = "w">FOOD<br><br>
        <input type="checkbox" id = "clealyness" name = "w">CLEAN
        <br><br>
        <label for = "fb" >Feed Back </label>
        <textarea rows="20" cols="30" name = "feed" id="fb" minlength="10" maxlength="100"></textarea>
        <br><br>
        <input type="submit" value="register ">
        <br><br>
    </form>
</body>
</html>
