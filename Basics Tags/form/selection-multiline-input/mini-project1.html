<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Job Application Form</title>
</head>
<body>
    <h1>Online Job Application Form </h1>
    <form>
        <label for = "name" >Full Name :</label>
        <input type="text" id ="name" required name="n" autofocus>
        <br><br>
        <label for = "email" >Email :</label>
        <input type="email" id = "email" required name = "e">
        <br><br>
        <label for = "date" > date :</label>
        <input type="date" id ="date" required name="g" >
        <br><br>
        <label for = "web" >Portfolio  :</label>
        <input type="url" id ="web" required name="w" >
        <br><br>
        <label for = "wb" >Resume :</label>
        <input type="file" id ="wb" required name="resume" >
        <br><br>
        <label for = "exp">Experience in years </label>
         <input type="number" id ="exp" required name="np" min =0 max = 20 >
        <br><br>
        <label for = "week" > Available week :</label>
        <input type="week" id ="week" required name="week" >
        <br><br>
        <label for = "time" >Preferred interview time: </label>
        <input type="time" id ="time" required name="c" >
        <br><br>
        <label for = "role"> Preferred job role :</label>
        <br><br>
        <select id="role" name = "role">
            <option>--select--</option>
            <option>Web Developer </option>
            <option>Software developer </option>
            <option>Prompt Engineering </option>
            <option>Frontend Developer </option>
            <option>backend Developer</option>
        </select>
        <br><br>
        <label for = "work">Work mode: </label><br><br>
        <input type="radio" name = "wm" id="workOffice">Office <br><br>
        <input type="radio" name = "wm" id="workHybrod">Hybrid <br><br>
        <input type="radio" name = "wm" id="workRemote">Remote <br><br>
        <label for = "skills" >Skills :</label>
        <input type="checkbox" name = "skill" id="ja" value = "java">JAVA <br><br>
        <input type="checkbox" name = "skill" id="S" value = "sql">SQL <br><br>
        <input type="checkbox" name = "skill" id="h" value = "html">HTML<br><br>
        <input type="checkbox" name = "skill" id="cs" value = "css">CSS <br><br>
        <input type="checkbox" name = "skill" id="py" value = "python">PYTHON <br><br>
        <label for="about"> About Yourself :</label><br><br>
        <textarea name = "ay" rows="20" cols="30" id ="about"></textarea>
        <br><br>
        <input type="submit" value="submit">
    </form>
  
</body>
</html>
