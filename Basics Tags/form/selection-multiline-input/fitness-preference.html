<body>
     <h1>Fitness Preference Form </h1>
     <form method="post">

         <input type="date" id = "dob" name ="dob">
         <br><br>

         <input type="radio" name = "pc" id ="activity"> Walking<br><br>
         <input type="radio" name = "pc" id ="activity">Yoga<br><br>
         <input type="radio" name = "pc" id ="activity">Running<br><br>
         <input type="radio" name = "pc" id ="activity">Cycling
        <br><br>

        <input type = "radio" name="pd" id = "Day" >Friday<br><br>
        <input type = "radio" name="pd" id = "Day" >Sunday
        <br><br>
        <label for = "time" >Preferred time: </label>
        <input type="time" id = "time"  name = "ti">
        <br><br>
        <label for = "infor" >Explain about  fitness </label>
        <br><br>
        <textarea name = "inform" id = "inform" rows ="10" cols ="30">

        </textarea>

     </form>
