<!doctype html>
<html>
	<head>
		<title>js String reverse </title>
	</head>
	<body>
	    <script>	
		
			
			 var s  = prompt("Enter the string ")
			 var rev = "";
			 var n = s.length;
			 for(var i=0;i<n;i++){
			   
				 rev += s[n-i-1]
				 
			 }
			 document.write(rev+"<br>")
		
		
		</script>
	</body>
</html>
