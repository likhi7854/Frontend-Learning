<!doctype html>
<html>
	<head>
		<title>Change Text Color</title> 
	</head>
	<body>
        <h1 id = "h1">Java Developer</h1>
        <button type = "button"  value = "Change Text Color"  onclick = "changeTextColor()">Change Text and  Color</button>
	    <script>	
            function changeTextColor() {
                   document.getElementById("h1").innerHTML = "Full Stack Developer";
                   document.getElementById("h1").style.color = "blue";
            }
		</script>
	</body>
</html>
